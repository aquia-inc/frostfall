version: 2

project_name: frostfall

builds:
  - main: ./cmd/frostfall
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Asset naming matches Emberfall's uname-style scheme
# (frostfall_{Darwin,Linux}_{arm64,x86_64}.tar.gz) so the team's existing
# checksum-verified `make install-emberfall` pattern transfers verbatim.
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

# semantic-release creates the tag and the GitHub release (with notes);
# goreleaser attaches binaries to that release rather than replacing it.
release:
  mode: keep-existing

# Container image: the binary plus a pinned Chromium, for CI users who prefer
# docker run over a binary install. The source label ties the ghcr package to
# this repo so it inherits repo visibility.
dockers:
  - image_templates:
      - ghcr.io/aquia-inc/frostfall:{{ .Version }}
      - ghcr.io/aquia-inc/frostfall:v{{ .Major }}
      - "{{ if not .Prerelease }}ghcr.io/aquia-inc/frostfall:latest{{ end }}"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/aquia-inc/frostfall
      - --label=org.opencontainers.image.description=Accessibility testing for rendered web apps
      - --label=org.opencontainers.image.licenses=Apache-2.0
      - --label=org.opencontainers.image.version={{ .Version }}

brews:
  - repository:
      owner: aquia-inc
      name: homebrew-frostfall
    homepage: https://github.com/aquia-inc/frostfall
    description: "Accessibility testing made easy"
    license: Apache-2.0
    test: |
      assert_match version.to_s, shell_output("#{bin}/frostfall --version")

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
