version: 2

project_name: frostfall

builds:
  - main: ./cmd/frostfall
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Asset naming matches Emberfall's uname-style scheme
# (frostfall_{Darwin,Linux}_{arm64,x86_64}.tar.gz) so the team's existing
# checksum-verified `make install-emberfall` pattern transfers verbatim.
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

# semantic-release creates the tag and the GitHub release (with notes);
# goreleaser attaches binaries to that release rather than replacing it.
release:
  mode: keep-existing

brews:
  - repository:
      owner: aquia-inc
      name: homebrew-frostfall
    homepage: https://github.com/aquia-inc/frostfall
    description: "Accessibility testing made easy"
    license: Apache-2.0
    # Formula generation runs, but pushing to the tap is disabled until the
    # repo goes public and homebrew-frostfall exists.
    skip_upload: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
