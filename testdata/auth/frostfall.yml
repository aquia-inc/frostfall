# Auth fixture, signed in: the storage state carries the session cookie, so
# the protected page is reached and its planted image-alt violation is found.
# CI expects exit 1. frostfall-nosession.yml is the same config with an empty
# state and must exit 3 (the login-redirect guard).
version: 1

server:
  serve: testdata/auth/site

auth:
  storageState: state-valid.json
  loginPath: /login.html

defaults:
  waitFor: load
  expect:
    severity: serious
    maxViolations: 0

tests:
  - id: protected
    path: /protected.html
