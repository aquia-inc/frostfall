<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth fixture: protected page</title>
  <script>
    // The session is a plain cookie: the static server has no way to set one,
    // and a cookie (unlike localStorage) is not tied to the ephemeral port the
    // fixture is served on. Without it this page sends the visitor to login
    // before anything renders, the way a real app's guard does.
    if (!document.cookie.split('; ').includes('ffsession=ok')) location.replace('/login.html');
  </script>
</head>
<body>
  <main data-testid="app-shell">
    <h1>Protected page</h1>

    <!-- planted: image-alt (critical). Reaching this page is what the
         expected exit 1 proves: a scan of the login page finds nothing. -->
    <img src="logo.png">

    <!-- A cross-site frame with a planted violation of its own (frame.html).
         127.0.0.1 and localhost are different sites; the src is set from
         script because the fixture server's port is ephemeral. The empty
         second frame makes axe tell the two apart by an attribute value, so
         the frame level of the target has a value to drop as well. -->
    <iframe title="Account widget"></iframe>
    <iframe title="Help panel" src="about:blank"></iframe>
    <script>
      const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
      document.querySelector('iframe[title="Account widget"]').src =
        location.protocol + '//' + other + ':' + location.port + '/frame.html';
    </script>
  </main>
</body>
</html>
