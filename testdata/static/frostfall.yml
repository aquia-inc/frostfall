version: 1

server:
  serve: testdata/static

defaults:
  standard: wcag21aa
  expect:
    severity: serious
    maxViolations: 0

tests:
  - id: fixture-initial
    path: /
    keyboard: true

  - id: fixture-dialog
    path: /
    scan: false
    steps:
      - click: "#open-dialog"
      - waitFor: "#dialog"
      - scan:
          label: dialog-open
          scope: "#dialog"
      - keyboard:
          label: dialog-open
          scope: "#dialog"
      - transcript:
          label: dialog-open
          scope: "#dialog"
      # planted: frostfall/focus-expectation - opening the dialog leaves
      # focus on its trigger
      - expectFocus:
          label: dialog-open
          within: "#dialog"
