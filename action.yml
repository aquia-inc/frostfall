# The Marketplace listing name must be globally unique (bare "Frostfall"
# collides with an existing account name); the repo and binary keep the
# short name.
name: Frostfall Accessibility Testing
description: Accessibility testing for rendered web apps. axe-core scans with baselines, so only new violations fail the build.
author: Aquia

branding:
  icon: cloud-snow
  color: blue

inputs:
  config:
    description: Path to the Frostfall config file.
    default: .frostfall.yml
  serve:
    description: "Static mode override: serve this build directory."
    default: ""
  base-url:
    description: "Attach mode override: scan an already-running server."
    default: ""
  baseline:
    description: Path to the baseline file.
    default: ""
  format:
    description: Report format (text, html, sarif, json, junit).
    default: html
  output:
    description: "Path to write the formatted report. Empty uses the format's default: frostfall-report.html (html), frostfall.sarif (sarif), frostfall.json (json), frostfall-junit.xml (junit)."
    default: ""
  profile:
    description: "Config profile to apply. Empty passes no flag, so the ci profile still applies automatically in Actions when the config defines one. \"none\" forces the base config."
    default: ""
  id:
    description: Run only tests whose id matches this Go regex.
    default: ""
  path:
    description: Run only tests whose path matches this Go regex (combines with id).
    default: ""
  discover:
    description: 'Set "true" to crawl same-origin links from the root and scan discovered pages in addition to configured tests.'
    default: ""
  screenshots:
    description: 'Violation screenshots. Empty keeps the CLI default (on in Actions). "true" forces them on, "false" disables them.'
    default: ""
  gh-issues:
    description: 'Set "true" to file/maintain GitHub issues for failing violations (workflow needs issues write permission). Only "true", "false" or empty are accepted.'
    default: "false"

outputs:
  new-violations:
    description: Count of new (non-baselined) violations at or above the marker severity.
    value: ${{ steps.run.outputs.new-violations }}
  baselined-violations:
    description: Count of violations matched by the baseline.
    value: ${{ steps.run.outputs.baselined-violations }}
  stale-baseline-entries:
    description: Baselined violations that no longer occur (fixable debt).
    value: ${{ steps.run.outputs.stale-baseline-entries }}
  tests-run:
    description: Number of tests executed.
    value: ${{ steps.run.outputs.tests-run }}
  report-file:
    description: Path of the written report (html, sarif, json and junit formats).
    value: ${{ steps.run.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Install frostfall
      shell: bash
      # The action version IS the tool version: this ref-pinned script resolves
      # the release matching the action's own tag, so @v1 can never drift.
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
      env:
        FROSTFALL_ACTION_REF: ${{ github.action_ref }}

    - name: Run frostfall
      id: run
      shell: bash
      # Inputs pass through env, never interpolated into the script body:
      # a crafted input must not be able to execute in the caller's runner.
      # scripts/run.sh turns them into a quoted argument array.
      env:
        FF_CONFIG: ${{ inputs.config }}
        FF_SERVE: ${{ inputs.serve }}
        FF_BASE_URL: ${{ inputs.base-url }}
        FF_BASELINE: ${{ inputs.baseline }}
        FF_FORMAT: ${{ inputs.format }}
        FF_OUTPUT: ${{ inputs.output }}
        FF_GH_ISSUES: ${{ inputs.gh-issues }}
        FF_PROFILE: ${{ inputs.profile }}
        FF_ID: ${{ inputs.id }}
        FF_PATH: ${{ inputs.path }}
        FF_DISCOVER: ${{ inputs.discover }}
        FF_SCREENSHOTS: ${{ inputs.screenshots }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
