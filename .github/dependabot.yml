# Dependency update automation. Commit-message prefixes are chosen to fit the
# conventional-commit release rules: Go module bumps ship in the binary and
# Docker base bumps ship in the image (usually security-motivated), so both
# release a patch (fix); action pins do not release. Not covered here: the
# semantic-release extra_plugins pins in release.yml (npm packages with no
# manifest) - those stay a manual watch, see the comment there.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      docker-base:
        patterns: ["*"]
