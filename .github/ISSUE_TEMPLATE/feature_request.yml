name: Feature request
description: Something Frostfall should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish that you currently cannot?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would this look like in the config or CLI? Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
