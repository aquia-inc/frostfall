name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -timeout 15m ./...

      - name: Integration test (fixture scan)
        # Runners ship Chrome; the fixture has 6 planted violations, so the
        # enforcing profile of this config must exit 1 - anything else means
        # the scan or the exit-code contract broke.
        run: |
          go build -o /tmp/frostfall ./cmd/frostfall
          set +e
          /tmp/frostfall --config testdata/static/frostfall.yml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (violations found), got $code"
            exit 1
          fi

      - name: Integration test (auth fixture, signed in)
        # The fixture's protected page redirects to login unless the session
        # cookie from the storage state is present, and carries one planted
        # violation. Exit 1 therefore proves the session was applied AND the
        # page was actually reached; a scan of the login page would find
        # nothing and exit 0.
        run: |
          set +e
          /tmp/frostfall --config testdata/auth/frostfall.yml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (protected page reached, violation found), got $code"
            exit 1
          fi

      - name: Integration test (auth fixture, no session)
        # Same page with an empty storage state: the page redirects to login,
        # and the run must stop with exit 3 (login-redirect guard) and say why,
        # rather than scan the login page and pass. The message check keeps an
        # unrelated exit 3 (a crashed browser, an unreachable server) from
        # passing for the guard.
        run: |
          set +e
          /tmp/frostfall --config testdata/auth/frostfall-nosession.yml 2> /tmp/auth-nosession.err
          code=$?
          set -e
          cat /tmp/auth-nosession.err
          if [ "$code" -ne 3 ]; then
            echo "expected exit 3 (landed on the login page), got $code"
            exit 1
          fi
          if ! grep -q "landed on the login page" /tmp/auth-nosession.err; then
            echo "exit 3 came from something other than the login guard"
            exit 1
          fi

      - name: Upload fixture scan evidence
        # Screenshots auto-capture in Actions; without this they evaporated
        # with the runner. Evidence is most useful when the scan misbehaves.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-scan-evidence
          path: frostfall-artifacts/
          if-no-files-found: ignore
