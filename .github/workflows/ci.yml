name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration test (fixture scan)
        # Runners ship Chrome; the fixture has 4 planted violations, so the
        # enforcing profile of this config must exit 1 - anything else means
        # the scan or the exit-code contract broke.
        run: |
          go build -o /tmp/frostfall ./cmd/frostfall
          set +e
          /tmp/frostfall --config testdata/static/frostfall.yml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (violations found), got $code"
            exit 1
          fi

      - name: Upload fixture scan evidence
        # Screenshots auto-capture in Actions; without this they evaporated
        # with the runner. Evidence is most useful when the scan misbehaves.
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fixture-scan-evidence
          path: frostfall-artifacts/
          if-no-files-found: ignore
