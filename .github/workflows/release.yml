name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Check release credentials
        id: creds
        env:
          CLIENT_ID: ${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ] || [ "$PRIVATE_KEY" = "REPLACE_ME" ]; then
            echo "::notice::Release credentials not populated (SEMANTIC_RELEASE_APP_CLIENT_ID variable + SEMANTIC_RELEASE_APP_PRIVATE_KEY secret); skipping release."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token
        if: steps.creds.outputs.configured == 'true'
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # client-id replaces the deprecated app-id input; it is public app
          # metadata, so it lives in a repo variable rather than a secret.
          client-id: ${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure Git
        if: steps.creds.outputs.configured == 'true'
        run: |
          git config user.name "aquia-semantic-release-bot[bot]"
          git config user.email "aquia-semantic-release-bot[bot]@users.noreply.github.com"

      - name: Run semantic-release
        if: steps.creds.outputs.configured == 'true'
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          # Majors pinned for compatibility with the semantic-release the
          # action bundles (^25, whose release-notes-generator 14.x pins
          # conventional-changelog-writer@^8): conventionalcommits@9 needs
          # writer 9 and fails generateNotes with "Missing helper".
          # Move conventionalcommits to @9 when the action ships
          # release-notes-generator 15 (brings writer 9).
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  build:
    name: Build and Publish Binaries
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to ghcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser needs write access to BOTH repos: release assets on
      # frostfall and the formula push to homebrew-frostfall. The default
      # GITHUB_TOKEN is scoped to this repo only, so mint an app token
      # covering both (the app is installed on both).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SEMANTIC_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: aquia-inc
          repositories: |
            frostfall
            homebrew-frostfall

      # release.mode keep-existing in .goreleaser.yaml attaches binaries to
      # the release semantic-release created, preserving its notes.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Move major version tag
        # Users pin @v1; the major tag follows every release under its major.
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "$MAJOR"

  enhance-notes:
    name: Enhance Release Notes
    needs: [release, build]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
