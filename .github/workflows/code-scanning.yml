name: Code Scanning Dogfood

# Uploads a real Frostfall SARIF run to GitHub code scanning on every push to
# main. This is a living validation of the SARIF contract (synthetic relative
# locations, primaryLocationLineHash identity, baselined omission): if GitHub
# ever rejects our output, this workflow goes red before a user hits it.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  scan-and-upload:
    name: Fixture Scan to Code Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan fixture
        # The fixture's enforcing config exits 1 on its planted violations;
        # that is the expected outcome, the SARIF file is the artifact.
        run: |
          go build -o /tmp/frostfall ./cmd/frostfall
          set +e
          /tmp/frostfall --config testdata/static/frostfall.yml --format sarif --output frostfall.sarif
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from the fixture scan, got $code"
            exit 1
          fi
          test -s frostfall.sarif

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: frostfall.sarif
          category: frostfall-fixture
